version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supply-chain-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LLM_MODE=fake
      - SYNAPT_MODE=mock
      - DATASET_SOURCE=synthetic
    volumes:
      - ./dataset/store:/app/dataset/store
      - ./artifacts:/app/artifacts
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supply-chain-ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
    command: ["streamlit", "run", "ui/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
