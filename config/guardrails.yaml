limits:
  max_text_length: 2000
  min_evidence_count: 1
  min_evidence_confidence: 0.35

injection_patterns:
  - "(?i)ignore\\s+(all\\s+)?(previous|above)\\s+instructions"
  - "(?i)system\\s+prompt"
  - "(?i)reveal\\s+(the\\s+)?(keys|passwords|credentials|secrets|token)"
  - "(?i)you\\s+are\\s+now\\s+in\\s+developer\\s+mode"
  - "(?i)<\\s*script"
  - "(?i)DAN\\s+mode"
  - "(?i)bypass\\s+(guardrails|safety|rules)"
  - "(?i)role\\s*:\\s*system"

off_topic_keywords:
  - "recipe"
  - "movie review"
  - "poem"
  - "sports score"
  - "celebrity gossip"
  - "horoscope"
  - "travel itinerary"

pii_patterns:
  email: "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}\\b"
  phone: "\\b(?:\\+?\\d{1,3}[-.\\s]?)?\\(?\\d{3}\\)?[-.\\s]?\\d{3}[-.\\s]?\\d{4}\\b"
  ssn_or_account: "\\b\\d{3}[-]?\\d{2}[-]?\\d{4}\\b"
  long_digits: "\\b\\d{12,19}\\b"

verifier_rules:
  no_causal_language:
    banned_phrases:
      - "caused by"
      - "because of"
      - "led to"
      - "directly caused"
    allowed_replacement: "associated with"
  no_guarantees:
    banned_phrases:
      - "will recover in"
      - "guaranteed to"
      - "will definitely"
      - "100% certainty"
    required_disclaimer: "Historical associations provide estimated ranges under uncertainty."
